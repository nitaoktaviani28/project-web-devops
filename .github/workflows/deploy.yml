name: Build & Deploy to K3d

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to K3d
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deployer
          chmod 600 ~/.ssh/deployer
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Update image tag in manifests
        run: |
          sed -i "s|image:.*|image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|g" k8s/deployment.yaml

      - name: Deploy to K3d via SSH
        run: |
          ssh -i ~/.ssh/deployer ubuntu@${{ secrets.EC2_HOST }} "mkdir -p /home/ubuntu/k8s"
          scp -i ~/.ssh/deployer -r k8s/ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/k8s/
          ssh -i ~/.ssh/deployer ubuntu@${{ secrets.EC2_HOST }} << 'DEPLOY'
            sudo kubectl create secret docker-registry dockerhub-secret \
              --docker-server=https://index.docker.io/v1/ \
              --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
              --docker-password=${{ secrets.DOCKERHUB_TOKEN }} \
              --dry-run=client -o yaml | sudo kubectl apply -f -
            sudo kubectl apply -f /home/ubuntu/k8s/
            sudo kubectl rollout status deployment/devops-demo-app --timeout=120s
            sudo kubectl get pods -l app=devops-demo-app
            sudo kubectl get svc devops-demo-app
          DEPLOY

      - name: Verify deployment
        run: |
          sleep 10
          curl -sf http://${{ secrets.EC2_HOST }}:30080/health || echo "Health check pending..."
