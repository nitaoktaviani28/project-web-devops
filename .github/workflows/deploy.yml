# ============================================
# CI/CD Pipeline - Build, Push & Deploy to K3s
# ============================================
name: Build & Deploy to K3s

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devops-demo-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to K3s
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deployer
          chmod 600 ~/.ssh/deployer
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Update image tag in manifests
        run: |
          sed -i "s|ghcr.io/YOUR_GITHUB_USERNAME/devops-demo-app:latest|${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|g" k8s/deployment.yaml

      - name: Deploy to K3s via SSH
        run: |
          # Copy manifests to server
          scp -i ~/.ssh/deployer -r k8s/ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/k8s/

          # Create GHCR pull secret & apply manifests
          ssh -i ~/.ssh/deployer ubuntu@${{ secrets.EC2_HOST }} << 'DEPLOY'
            # Create/update GHCR pull secret
            sudo kubectl create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password=${{ secrets.GHCR_TOKEN }} \
              --dry-run=client -o yaml | sudo kubectl apply -f -

            # Apply Kubernetes manifests
            sudo kubectl apply -f /home/ubuntu/k8s/

            # Wait for rollout
            sudo kubectl rollout status deployment/devops-demo-app --timeout=120s

            # Show status
            echo "=== Pods ==="
            sudo kubectl get pods -l app=devops-demo-app
            echo "=== Service ==="
            sudo kubectl get svc devops-demo-app
          DEPLOY

      - name: Verify deployment
        run: |
          sleep 10
          curl -sf http://${{ secrets.EC2_HOST }}:30080/health || echo "Health check pending..."
